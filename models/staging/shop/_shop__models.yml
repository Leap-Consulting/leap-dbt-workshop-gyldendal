models:
  - name: stg_shop__imprints
    columns:
      - name: imprint_id
        data_tests:
          - unique
          - not_null

  - name: stg_shop__titles
    columns:
      - name: isbn
        data_tests:
          - unique
          - not_null

  - name: stg_shop__customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: stg_shop__orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'delivered', 'cancelled']
